[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "1.0.0"
description = "Evaluation-guided coding-agent harness for scientific Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pranay Pandey" }]
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]
benchmark = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pytest>=8.2",
]
analysis = [
  "matplotlib>=3.9",
  "pandas>=2.2",
  "seaborn>=0.13",
]
llm = ["litellm>=1.44"]
demo = ["pillow>=10"]

[project.scripts]
evalforge = "evalforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["evalforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "benchmarks",
  "experiments",
  "scripts/generate_benchmarks.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
