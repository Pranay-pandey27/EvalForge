name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/evalforge tests
      - run: pytest --cov=evalforge --cov-report=term-missing
      - run: evalforge validate-suite benchmarks/development --execute
      - run: evalforge validate-suite benchmarks/evaluation --execute
